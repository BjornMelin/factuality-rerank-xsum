[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "factuality-rerank-xsum"
version = "0.1.0"
description = "Reproducible XSum factuality-aware reranking repo with an executed offline fallback pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "OpenAI GPT-5.4 Pro build session"},
]
dependencies = [
  "jsonlines>=4.0.0,<5",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=21,<23",
  "pyyaml>=6.0,<7",
  "rich>=13,<15",
  "rouge-score>=0.1.2",
  "scikit-learn>=1.5,<2",
  "typer>=0.12,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "nbformat>=5.10,<6",
  "pandas-stubs>=2.2.2,<3",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12,<7",
]
notebooks = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.2,<5",
]

[project.scripts]
factuality-rerank-xsum = "factuality_rerank_xsum.cli.main:app"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true
plugins = []

[[tool.mypy.overrides]]
module = [
  "jsonlines",
  "matplotlib",
  "matplotlib.*",
  "pyarrow",
  "pyarrow.*",
  "rouge_score",
  "typer",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-q"]
testpaths = ["tests"]
